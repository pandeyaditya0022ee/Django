{% extends "layout.html" %}

{% block title %}Add Movie - Metflix{% endblock %}

{% block content %}
    <h2>{% if form.instance.pk %}Edit Movie{% else %}Add Movie{% endif %}</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" id="btn">
            {% if form.instance.pk %}Update Movie{% else %}Add Movie{% endif %}
        </button>
    </form>
{% endblock %}
{% endblock %}
