{% extends "layout.html" %}

{% block content %}
<div class="login-container">
    <div class="auth-card">
        <h2>Login</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="auth-actions">
                <button type="submit" id="btn">Login</button>
            </div>
        </form>
        <p class="auth-help">Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
    </div>
</div>
{% endblock %}
